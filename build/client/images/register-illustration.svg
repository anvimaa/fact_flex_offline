<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="600" viewBox="0 0 900 600" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Definições de gradientes e padrões -->
    <defs>
        <!-- Gradiente principal -->
        <linearGradient id="mainGradient" x1="0" y1="0" x2="900" y2="600">
            <stop offset="0%" style="stop-color:#4338ca;stop-opacity:1"/>
            <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1"/>
        </linearGradient>
        
        <!-- Gradiente para elementos -->
        <linearGradient id="elementGradient" x1="0" y1="0" x2="300" y2="300">
            <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1"/>
            <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1"/>
        </linearGradient>
        
        <!-- Padrão de grade -->
        <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#6366f1" stroke-width="0.5" opacity="0.2"/>
        </pattern>
    </defs>

    <!-- Fundo -->
    <rect width="900" height="600" fill="url(#mainGradient)"/>
    <rect width="900" height="600" fill="url(#grid)"/>

    <!-- Círculos decorativos de fundo -->
    <circle cx="100" cy="100" r="200" fill="#4338ca" opacity="0.1"/>
    <circle cx="800" cy="500" r="250" fill="#6366f1" opacity="0.1"/>

    <!-- Container principal -->
    <g transform="translate(450, 300)">
        <!-- Formas geométricas flutuantes -->
        <g transform="translate(-200, -150)">
            <rect x="0" y="0" width="80" height="80" rx="20" fill="url(#elementGradient)" opacity="0.9" transform="rotate(-15)"/>
            <circle cx="60" cy="60" r="10" fill="white" opacity="0.6"/>
        </g>

        <!-- Elemento central - Formulário estilizado -->
        <g transform="translate(0, 0)">
            <!-- Moldura do formulário -->
            <rect x="-120" y="-160" width="240" height="320" rx="30" fill="white" opacity="0.1"/>
            <rect x="-110" y="-150" width="220" height="300" rx="25" fill="white" opacity="0.15"/>
            
            <!-- Campos do formulário -->
            <g transform="translate(0, -100)">
                <!-- Campo Nome -->
                <rect x="-80" y="0" width="160" height="30" rx="8" fill="white" opacity="0.3"/>
                <circle cx="-60" cy="15" r="8" fill="url(#elementGradient)"/>
                <rect x="-40" y="10" width="100" height="10" rx="2" fill="white" opacity="0.4"/>
            </g>
            
            <g transform="translate(0, -40)">
                <!-- Campo Email -->
                <rect x="-80" y="0" width="160" height="30" rx="8" fill="white" opacity="0.3"/>
                <circle cx="-60" cy="15" r="8" fill="url(#elementGradient)"/>
                <rect x="-40" y="10" width="100" height="10" rx="2" fill="white" opacity="0.4"/>
            </g>
            
            <g transform="translate(0, 20)">
                <!-- Campo Senha -->
                <rect x="-80" y="0" width="160" height="30" rx="8" fill="white" opacity="0.3"/>
                <circle cx="-60" cy="15" r="8" fill="url(#elementGradient)"/>
                <rect x="-40" y="10" width="100" height="10" rx="2" fill="white" opacity="0.4"/>
            </g>
            
            <!-- Botão de registro -->
            <g transform="translate(0, 80)">
                <rect x="-60" y="0" width="120" height="40" rx="20" fill="url(#elementGradient)"/>
                <rect x="-40" y="15" width="80" height="10" rx="2" fill="white" opacity="0.6"/>
            </g>
        </g>

        <!-- Elementos decorativos flutuantes -->
        <g transform="translate(150, -100)">
            <circle cx="0" cy="0" r="40" fill="white" opacity="0.1"/>
            <circle cx="0" cy="0" r="30" fill="white" opacity="0.15"/>
            <path d="M-15,-15 L15,15 M-15,15 L15,-15" stroke="white" stroke-width="4" opacity="0.6"/>
        </g>

        <g transform="translate(-180, 100)">
            <rect width="60" height="60" rx="15" fill="url(#elementGradient)" opacity="0.7" transform="rotate(15)"/>
            <path d="M15,30 L45,30 M30,15 L30,45" stroke="white" stroke-width="4" stroke-linecap="round" transform="rotate(15)"/>
        </g>
    </g>

    <!-- Partículas e linhas de conexão -->
    <g>
        <!-- Partículas -->
        <circle cx="200" cy="150" r="3" fill="white" opacity="0.6"/>
        <circle cx="700" cy="200" r="2" fill="white" opacity="0.6"/>
        <circle cx="300" cy="500" r="4" fill="white" opacity="0.6"/>
        <circle cx="800" cy="400" r="3" fill="white" opacity="0.6"/>
        
        <!-- Linhas de conexão -->
        <path d="M200,150 C300,200 600,100 700,200" stroke="white" stroke-width="1" opacity="0.2"/>
        <path d="M300,500 C400,450 700,450 800,400" stroke="white" stroke-width="1" opacity="0.2"/>
    </g>

    <!-- Ondas decorativas -->
    <g transform="translate(0,500)">
        <path d="M0,0 Q225,50 450,0 T900,0" fill="none" stroke="white" stroke-width="2" opacity="0.1"/>
        <path d="M0,20 Q225,70 450,20 T900,20" fill="none" stroke="white" stroke-width="2" opacity="0.05"/>
    </g>
</svg>
